name: TDR Run Consignment Export Tests
on:
  pull_request:
  push:
    branches-ignore:
      - master
      - release-*
permissions: {}
jobs:
  test:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@f4d7086babd2c5156dd483d445e4500a603d8dc4 # v.0.0.42
    with:
      repo-name: tdr-consignment-export
      test-command: |
        docker build -f Dockerfile-tests -t tests .
        sbt test
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
